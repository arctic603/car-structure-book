<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>汽车构造原理 - 在线阅读</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 顶部工具栏 ── */
    #toolbar {
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 10;
    }

    #toolbar h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e94560;
      margin-right: auto;
      white-space: nowrap;
    }

    .tb-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f3460;
      border-radius: 8px;
      padding: 4px 8px;
    }

    .tb-group label {
      font-size: 13px;
      color: #a0aec0;
    }

    .tb-btn {
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .tb-btn:hover { background: #c73652; }
    .tb-btn:disabled { background: #444; cursor: not-allowed; }

    .tb-icon-btn {
      background: transparent;
      color: #e0e0e0;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
      line-height: 1;
    }
    .tb-icon-btn:hover { background: #0f3460; }
    .tb-icon-btn:disabled { color: #555; cursor: not-allowed; }

    #pageInput {
      width: 50px;
      text-align: center;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #0f3460;
      border-radius: 4px;
      padding: 4px;
      font-size: 13px;
    }

    #zoomSelect {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #0f3460;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ── 主体区域 ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── 侧边缩略图 ── */
    #sidebar {
      width: 130px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      overflow-y: auto;
      flex-shrink: 0;
      padding: 8px 4px;
      scrollbar-width: thin;
      scrollbar-color: #0f3460 transparent;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 2px; }

    .thumb-item {
      cursor: pointer;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.15s;
      position: relative;
    }
    .thumb-item:hover { transform: scale(1.03); border-color: #e94560; }
    .thumb-item.active { border-color: #e94560; }
    .thumb-item canvas { display: block; width: 100%; }
    .thumb-num {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 10px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* ── 画布容器 ── */
    #viewer {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      scrollbar-width: thin;
      scrollbar-color: #0f3460 transparent;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(14,30,60,0.5) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(233,69,96,0.08) 0%, transparent 60%),
        #1a1a2e;
    }
    #viewer::-webkit-scrollbar { width: 6px; height: 6px; }
    #viewer::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

    .page-wrapper {
      position: relative;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
      max-width: 100%;
      max-height: 100%;
    }
    .page-wrapper canvas { display: block; max-width: 100%; max-height: 100%; }

    /* ── 加载 & 欢迎 ── */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #a0aec0;
      text-align: center;
      padding: 40px;
    }
    #welcome .icon { font-size: 64px; }
    #welcome h2 { font-size: 22px; color: #e0e0e0; }
    #welcome p { font-size: 14px; line-height: 1.8; max-width: 380px; }

    #loadingBar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      background: #e94560;
      transition: width 0.3s;
      z-index: 100;
      display: none;
    }

    #progressInfo {
      color: #a0aec0;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    /* ── 响应式 ── */
    @media (max-width: 600px) {
      #sidebar { display: none; }
      #toolbar h1 { display: none; }
    }
  </style>
</head>
<body>

<div id="loadingBar"></div>

<div id="toolbar">
  <h1>📖 汽车构造原理</h1>

  <div class="tb-group">
    <button class="tb-icon-btn" id="prevBtn" disabled title="上一页">‹</button>
    <input id="pageInput" type="number" min="1" value="1" disabled />
    <span id="totalPages" style="font-size:13px;color:#a0aec0">/ 0</span>
    <button class="tb-icon-btn" id="nextBtn" disabled title="下一页">›</button>
  </div>

  <div class="tb-group">
    <label>缩放</label>
    <select id="zoomSelect" disabled>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
      <option value="fit">适合宽度</option>
    </select>
  </div>

  <button class="tb-btn" id="fullscreenBtn" disabled>⛶ 全屏</button>
  <button class="tb-btn" id="downloadBtn" disabled>⬇ 下载</button>
</div>

<div id="main">
  <div id="sidebar"></div>

  <div id="viewer">
    <div id="welcome">
      <div class="icon">🚗</div>
      <h2>汽车构造原理</h2>
      <p>正在加载 PDF 文件，请稍候…<br/>文件较大（173MB），首次加载需要片刻</p>
      <div id="progressInfo"></div>
    </div>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const PDF_URL = './automotive_principles.pdf?v=2';

  let pdfDoc = null;
  let currentPage = 1;
  let scale = 1.0;
  let renderTask = null;

  const viewer    = document.getElementById('viewer');
  const sidebar   = document.getElementById('sidebar');
  const welcome   = document.getElementById('welcome');
  const prevBtn   = document.getElementById('prevBtn');
  const nextBtn   = document.getElementById('nextBtn');
  const pageInput = document.getElementById('pageInput');
  const totalPagesEl = document.getElementById('totalPages');
  const zoomSelect   = document.getElementById('zoomSelect');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const downloadBtn   = document.getElementById('downloadBtn');
  const loadingBar    = document.getElementById('loadingBar');
  const progressInfo  = document.getElementById('progressInfo');

  // ── 加载 PDF ──
  function loadPDF() {
    loadingBar.style.display = 'block';
    loadingBar.style.width = '5%';
    progressInfo.style.display = 'block';

    const loadingTask = pdfjsLib.getDocument({
      url: PDF_URL,
      cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
      cMapPacked: true,
    });

    loadingTask.onProgress = ({ loaded, total }) => {
      if (total) {
        const pct = Math.round((loaded / total) * 90);
        loadingBar.style.width = pct + '%';
        progressInfo.textContent = `加载中 ${(loaded/1024/1024).toFixed(1)} / ${(total/1024/1024).toFixed(1)} MB`;
      }
    };

    loadingTask.promise.then(pdf => {
      pdfDoc = pdf;
      loadingBar.style.width = '100%';
      setTimeout(() => { loadingBar.style.display = 'none'; }, 400);
      progressInfo.style.display = 'none';

      totalPagesEl.textContent = `/ ${pdf.numPages}`;
      pageInput.max = pdf.numPages;
      pageInput.disabled = false;
      zoomSelect.disabled = false;
      prevBtn.disabled = false;
      nextBtn.disabled = false;
      fullscreenBtn.disabled = false;
      downloadBtn.disabled = false;

      viewer.removeChild(welcome);
      buildThumbnails();
      renderCurrentPage();
    }).catch(err => {
      console.error(err);
      progressInfo.textContent = '❌ 加载失败：' + err.message;
      progressInfo.style.color = '#e94560';
    });
  }

  // ── 渲染当前页（单页模式） ──
  async function renderCurrentPage() {
    viewer.innerHTML = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'page-wrapper';
    wrapper.id = 'page-' + currentPage;
    viewer.appendChild(wrapper);
    await renderPage(currentPage, wrapper);
  }

  function getScale() {
    const v = zoomSelect.value;
    if (v === 'fit') {
      return (viewer.clientWidth - 48) / 595;
    }
    return parseFloat(v);
  }

  async function renderPage(num, wrapper) {
    const page = await pdfDoc.getPage(num);
    const s = getScale();
    const viewport = page.getViewport({ scale: s });
    const canvas = document.createElement('canvas');
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    wrapper.style.width  = viewport.width + 'px';
    wrapper.innerHTML = '';
    wrapper.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  }

  // ── 构建侧边缩略图 ──
  async function buildThumbnails() {
    sidebar.innerHTML = '';
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const vp   = page.getViewport({ scale: 0.18 });
      const canvas = document.createElement('canvas');
      canvas.width  = vp.width;
      canvas.height = vp.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

      const item = document.createElement('div');
      item.className = 'thumb-item' + (i === 1 ? ' active' : '');
      item.dataset.page = i;
      item.appendChild(canvas);
      const num = document.createElement('div');
      num.className = 'thumb-num';
      num.textContent = i;
      item.appendChild(num);
      item.addEventListener('click', () => gotoPage(i));
      sidebar.appendChild(item);
    }
  }

  function gotoPage(n) {
    currentPage = Math.max(1, Math.min(pdfDoc.numPages, n));
    updateActive(currentPage);
    renderCurrentPage();
  }

  function updateActive(n) {
    currentPage = n;
    pageInput.value = n;
    sidebar.querySelectorAll('.thumb-item').forEach(el => {
      el.classList.toggle('active', parseInt(el.dataset.page) === n);
    });
    prevBtn.disabled = n <= 1;
    nextBtn.disabled = n >= (pdfDoc ? pdfDoc.numPages : 1);
  }

  // ── 导航按钮 ──
  prevBtn.addEventListener('click', () => gotoPage(currentPage - 1));
  nextBtn.addEventListener('click', () => gotoPage(currentPage + 1));
  pageInput.addEventListener('change', () => {
    const n = parseInt(pageInput.value) || 1;
    gotoPage(n);
  });

  // ── 缩放 ──
  zoomSelect.addEventListener('change', () => { renderCurrentPage(); });

  // ── 全屏 ──
  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
      fullscreenBtn.textContent = '⛶ 退出全屏';
    } else {
      document.exitFullscreen();
      fullscreenBtn.textContent = '⛶ 全屏';
    }
  });

  // ── 下载 ──
  downloadBtn.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = PDF_URL;
    a.download = '汽车构造原理.pdf';
    a.click();
  });

  // ── 键盘快捷键 ──
  document.addEventListener('keydown', e => {
    if (!pdfDoc) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') gotoPage(currentPage + 1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   gotoPage(currentPage - 1);
    if (e.key === 'Home') gotoPage(1);
    if (e.key === 'End')  gotoPage(pdfDoc.numPages);
  });

  // ── 启动 ──
  loadPDF();
</script>
</body>
</html>
